# Cloudflare Worker deployment config
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "macro-simulator"
main = "worker/index.js"
compatibility_date = "2025-11-01"

# Front-end files (index.html / app.js / i18n.js / style.css).
# Requests that do not match a file (i.e. /api/*) are forwarded to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Game state lives here instead of data/state.json (Workers have no file system).
# Get the real id with:  npx wrangler d1 create econ-sim
# or from the dashboard: Workers & Pages → D1 → econ-sim → copy "Database ID"
# IMPORTANT: it must be a real 32-char id; leaving the placeholder below makes
# every deploy fail with "binding DB of type d1 must have a valid `database_id`"
[[d1_databases]]
binding = "DB"
database_name = "econ-sim"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
